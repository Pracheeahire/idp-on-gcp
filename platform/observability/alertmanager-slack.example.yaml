# Copy to alertmanager-slack.local.yaml (git-ignored) and paste your Slack
# incoming-webhook URL. The URL is a secret: anyone with it can post to your channel.
#
# Routing: alerts labelled namespace="sample" go to Slack; everything else
# (including the always-firing Watchdog heartbeat) goes nowhere.

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 2h
      routes:
        - receiver: slack
          matchers:
            - namespace="sample"
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url: "https://hooks.slack.com/services/PASTE/YOUR/WEBHOOK"
            channel: "#alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: >-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}
